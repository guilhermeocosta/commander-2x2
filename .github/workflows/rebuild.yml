name: Daily rebuild

# The site is static, so date-dependent output (upcoming vs past events on
# /eventos, the next event on /hall-da-fama) is frozen at build time. This
# workflow triggers a fresh production deploy every morning via a Vercel
# Deploy Hook, so an event moves to "past" the day after it happens.

on:
  schedule:
    # 09:00 UTC = 06:00 in São Paulo (UTC-3, no DST).
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  deploy-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel production deploy
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK_URL secret is not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK_URL"
